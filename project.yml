name: TransporteIBMEC
options:
  bundleIdPrefix: com.brenoch
configs:
  Debug: debug
  Release: release
settings:
  SWIFT_VERSION: 5.0
targets:
  TransporteIBMEC:
    type: application
    platform: iOS
    deploymentTarget: "13.2"
    bundleId: com.brenoch.TransporteIBMEC
    sources:
      - path: .
        excludes:
          - "Tests iOS/**"
          - "Tests macOS/**"
          - "macOS/**"
          - "*.xcodeproj"
          - "project.yml"
          - "README.md"
          - "Info.plist"
    resources:
      - Assets
    settings:
      PRODUCT_NAME: TransporteIBMEC
      INFOPLIST_FILE: Info.plist
      GENERATE_INFOPLIST_FILE: "NO"
